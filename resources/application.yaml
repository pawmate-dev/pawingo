schema: 1
storage:
  directory: pawingo
  database: pawingo.sqlite3
  plugins: plugins
  plugin_override_env: PAWINGO_PLUGIN_DIR
packages:
  catalog_url: https://github.com/pawmate-dev/pawingo/releases/latest/download/plugins-v1.yaml
  service: github.plugins
  cache: catalog-v1.yaml
  inventory: installed.yaml
  manifest: plugin.yaml
  catalog_bytes: 1048576
  download_bytes: 268435456
  expanded_bytes: 536870912
  max_entries: 10000
  timeout_seconds: 600
  list_rows: 5
  description_height: 3
  status_height: 3
diagnostics:
  file: logs/pawingo.log
theme:
  content_width: 72
  wordmark: P a w i n g o
  selection: ["●  ", "   "]
  field_selection: ["● ", "  "]
  footer_separator: "   ·   "
  colors:
    ink: [201, 194, 171]
    secondary: [145, 139, 120]
    muted: [112, 107, 93]
    faint: [64, 67, 55]
    olive: [139, 150, 112]
    accent: [211, 101, 69]
activity:
  weeks: 14
  thresholds: [1, 5, 10, 20]
  level_colors: [faint, muted, secondary, olive, ink]
  marks: ['·', '◦', '○', '●', '●']
review:
  desired_retention: 0.9
  again_seconds: 600
  minimum_interval_days: 1
  maximum_interval_days: 36500
  queue_batch_size: 50
  body_height: 8
  subtitle_height: 2
  meaning_height: 3
  source_height: 1
  rating_width: 12
  scroll_step_percent: 10
  status_height: 2
  rating_labels: [again, hard, good, easy]
services:
  default_policy: ask
network:
  download_bytes: 67108864
  timeout_seconds: 180
  connect_timeout_seconds: 15
  max_redirects: 5
languages:
  - [Japanese, 日本語, '🇯🇵']
  - [German, Deutsch, '🇩🇪']
  - [English, English, '🇬🇧']
