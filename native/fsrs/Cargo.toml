[package]
name = "pawingo-fsrs-ffi"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
fsrs = "=6.6.2"

[build-dependencies]
cbindgen = "=0.29.2"

[profile.release]
panic = "unwind"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
