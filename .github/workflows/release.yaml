name: Native release draft
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to validate
        type: choice
        options: [all, linux, windows]
        default: all
      tag:
        description:
          Version to validate when running on a branch (no Release is created)
        default: v0.1.0
        required: true
        type: string
env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.platform == 'windows' &&
          '[{"runner":"windows-2025","platform":"windows-x86_64","arch":"x64","msvc_arch":"x64","shell":"pwsh"},{"runner":"windows-11-arm","platform":"windows-aarch64","arch":"arm64","msvc_arch":"arm64","shell":"pwsh"}]'
          || inputs.platform == 'linux' &&
          '[{"runner":"ubuntu-22.04","platform":"linux-x86_64-gnu","arch":"x86_64"},{"runner":"ubuntu-22.04-arm","platform":"linux-aarch64-gnu","arch":"arm64"}]'
          ||
          '[{"runner":"ubuntu-22.04","platform":"linux-x86_64-gnu","arch":"x86_64"},{"runner":"ubuntu-22.04-arm","platform":"linux-aarch64-gnu","arch":"arm64"},{"runner":"windows-2025","platform":"windows-x86_64","arch":"x64","msvc_arch":"x64","shell":"pwsh"},{"runner":"windows-11-arm","platform":"windows-aarch64","arch":"arm64","msvc_arch":"arm64","shell":"pwsh"},{"runner":"macos-15-intel","platform":"macos-x86_64","arch":"x86_64","llvm":"llvm@18"},{"runner":"macos-15","platform":"macos-aarch64","arch":"arm64","llvm":"llvm@22"}]')
          }}
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}
    env:
      PAWINGO_RELEASE_BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v3
        if: runner.os != 'Windows' || runner.arch != 'ARM64'
      - name: Install just natively on Windows ARM64
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: cargo install just --locked --version 1.59.0
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.2"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Install Ubuntu compiler and native tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config patchelf libsqlite3-dev libcurl4-openssl-dev libarchive-dev libexpat1-dev zlib1g-dev
          curl --fail --location https://apt.llvm.org/llvm.sh --output "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 22
          sudo apt-get install -y clang-tools-22 libc++-22-dev libc++abi-22-dev
          echo '/usr/lib/llvm-22/bin' >> "$GITHUB_PATH"
      - name: Install macOS compiler and native tools
        if: runner.os == 'macOS'
        env:
          LLVM_FORMULA: ${{ matrix.llvm }}
        run: |
          brew install "$LLVM_FORMULA" cmake ninja pkgconf
          echo "$(brew --prefix "$LLVM_FORMULA")/bin" >> "$GITHUB_PATH"
          echo "PAWINGO_LLVM_PREFIX=$(brew --prefix "$LLVM_FORMULA")" >> "$GITHUB_ENV"
      - name: Configure Windows
        if: runner.os == 'Windows'
        run:
          xmake f -y -p windows -m release -a '${{ matrix.arch }}'
          --toolchain=msvc --runtimes=MD
      - name: Configure Ubuntu
        if: runner.os == 'Linux'
        run:
          xmake f -y -m release -a '${{ matrix.arch }}' --toolchain=clang
          --runtimes=c++_shared
      - name: Enable LLVM 18 experimental threading support
        if: matrix.llvm == 'llvm@18'
        run:
          echo 'PAWINGO_EXPERIMENTAL_FLAGS=-fexperimental-library' >>
          "$GITHUB_ENV"
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: >-
          xmake f -y -m release -a '${{ matrix.arch }}' --toolchain=clang
          --runtimes=c++_shared --cxflags="-I$PAWINGO_LLVM_PREFIX/include/c++/v1
          -D_LIBCPP_DISABLE_AVAILABILITY $PAWINGO_EXPERIMENTAL_FLAGS"
          --ldflags="-L$PAWINGO_LLVM_PREFIX/lib/c++
          -Wl,-rpath,$PAWINGO_LLVM_PREFIX/lib/c++ $PAWINGO_EXPERIMENTAL_FLAGS"
          --shflags="-L$PAWINGO_LLVM_PREFIX/lib/c++
          -Wl,-rpath,$PAWINGO_LLVM_PREFIX/lib/c++ $PAWINGO_EXPERIMENTAL_FLAGS"
      - name: Check standard-library module and threading support
        run: |
          xmake build toolchain-check
          xmake run toolchain-check
      - name: Build and verify Windows
        if: runner.os == 'Windows'
        run: |
          just --shell pwsh --clear-shell-args --shell-arg=-NoProfile --shell-arg=-Command build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          just --shell pwsh --clear-shell-args --shell-arg=-NoProfile --shell-arg=-Command test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uvx ruff check tools tests/test_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uvx ruff format --check tools tests/test_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake release-paths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify
        if: runner.os != 'Windows'
        run: |
          just build
          just test
          uvx ruff check tools tests/test_release.py
          uvx ruff format --check tools tests/test_release.py
          xmake release-paths
      - name: Package Windows plugin
        if: runner.os == 'Windows'
        run:
          python tools/release.py plugin --tag $env:RELEASE_TAG --repo
          $env:GITHUB_REPOSITORY
      - name: Package plugin and embed its native catalog
        if: runner.os != 'Windows'
        run:
          python tools/release.py plugin --tag "$RELEASE_TAG" --repo
          "$GITHUB_REPOSITORY"
      - name: Package and smoke-test Windows host and plugin
        if: runner.os == 'Windows'
        env:
          PAWINGO_CATALOG_SOURCE: build/release/plugins-v1.yaml
        run: |
          xmake build pawingo
          python tools/release.py core --tag $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
      - name: Package and smoke-test relocated host and plugin
        if: runner.os != 'Windows'
        env:
          PAWINGO_CATALOG_SOURCE: build/release/plugins-v1.yaml
        run: |
          xmake build pawingo
          python tools/release.py core --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            build/release/*.tar.gz
            build/release/plugins-v1.yaml
            build/release/SHA256SUMS
  linux-runtime:
    name: Runtime / ${{ matrix.distro }} / ${{ matrix.platform }}
    if: inputs.platform != 'windows'
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        distro:
          [ubuntu-22.04, ubuntu-24.04, debian-12, debian-13, fedora-44, arch]
        exclude:
          # The official Arch image is x86_64 only; Arch Linux ARM is a separate project.
          - runner: ubuntu-24.04-arm
            distro: arch
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64-gnu
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64-gnu
          - distro: ubuntu-22.04
            image: ubuntu:22.04
          - distro: ubuntu-24.04
            image: ubuntu:24.04
          - distro: debian-12
            image: debian:12-slim
          - distro: debian-13
            image: debian:13-slim
          - distro: fedora-44
            image: registry.fedoraproject.org/fedora:44
          - distro: arch
            image: archlinux:base
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: build/runtime-artifact
      - name: Prepare minimal distribution runtime
        env:
          RUNTIME_IMAGE: ${{ matrix.image }}
        run: |
          docker pull "$RUNTIME_IMAGE"
          docker build --build-arg "BASE_IMAGE=$RUNTIME_IMAGE" \
            --tag pawingo-runtime --file tools/ci/linux-runtime.Dockerfile tools/ci
      - name: Test the unchanged release without networking or build tools
        env:
          RUNTIME_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:exec,size=1g \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$PWD/tools/linux_smoke.py,target=/test/linux_smoke.py,readonly" \
            --mount "type=bind,source=$PWD/tests/fixtures/jmdict.xml,target=/test/jmdict.xml,readonly" \
            --mount "type=bind,source=$PWD/build/runtime-artifact,target=/artifacts,readonly" \
            pawingo-runtime python3 /test/linux_smoke.py --artifacts /artifacts \
              --platform "$RUNTIME_PLATFORM" --dictionary /test/jmdict.xml
  draft:
    if: inputs.platform == 'all' || github.ref_type == 'tag'
    needs: [build, linux-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: build/native
      - name: Verify all platforms and merge plugin catalog
        run: >-
          python -m tools.release_collect --inputs build/native --output
          build/publish --tag "$RELEASE_TAG" --build "$GITHUB_SHA"
      - uses: actions/upload-artifact@v6
        with:
          name: verified-release
          path: build/publish/
          if-no-files-found: error
      - name: Create one draft after every platform passed
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build/publish && sha256sum -c SHA256SUMS)
          assets=()
          while IFS= read -r line; do
            assets+=("build/publish/${line#*  }")
          done < build/publish/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" build/publish/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
